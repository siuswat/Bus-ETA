<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>香港巴士到站時間 ETA</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: rgba(255, 255, 255, .9);
      --card-solid: #ffffff;
      --text: #142033;
      --muted: #65758b;
      --line: rgba(20, 32, 51, .11);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, .1);
      --green: #16a34a;
      --red: #dc2626;
      --shadow: 0 18px 45px rgba(15, 23, 42, .09);
    }

    [data-theme="dark"] {
      --bg: #08111f;
      --card: rgba(17, 28, 47, .88);
      --card-solid: #111c2f;
      --text: #f3f7ff;
      --muted: #97a6ba;
      --line: rgba(255, 255, 255, .12);
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, .14);
      --green: #4ade80;
      --red: #fb7185;
      --shadow: 0 18px 45px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 0%, rgba(37, 99, 235, .12), transparent 34%),
        radial-gradient(circle at 90% 4%, rgba(22, 163, 74, .10), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
    }

    .app {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 10px 0 14px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, .85fr);
      gap: 14px;
      align-items: start;
    }

    .topbar {
      display: grid;
      grid-template-columns: 46px 1fr 46px 46px;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .gear-btn {
      width: 46px;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
      font-size: 22px;
      cursor: pointer;
      backdrop-filter: blur(16px);
    }

    .refresh-btn {
      width: 46px;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
      font-size: 20px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      transition: transform .5s ease;
    }

    .refresh-btn.spinning {
      transform: rotate(360deg);
    }

    .refresh-btn:active {
      transform: scale(.9);
    }

    .clock-box {
      min-height: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .system-time {
      font-size: clamp(23px, 7vw, 34px);
      font-weight: 950;
      line-height: 1;
      letter-spacing: -.03em;
    }

    .system-date {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .status-dot {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      color: var(--muted);
      font-size: 18px;
      backdrop-filter: blur(16px);
    }

    .stations-wrap {
      display: grid;
      gap: 14px;
    }

    .station-section {
      display: none;
    }

    .station-section.active {
      display: block;
    }

    .stop-title {
      margin-bottom: 10px;
      padding: 14px;
      border-radius: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .stop-name {
      font-size: clamp(22px, 6vw, 32px);
      font-weight: 950;
      line-height: 1.15;
      letter-spacing: -.02em;
      text-align: center;
    }

    .stop-meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
    }

    .route-dot {
      width: calc(25% - 6px);
      min-height: 92px;
      border-radius: 22px;
      padding: 9px 7px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      text-align: center;
      overflow: hidden;
    }

    .route-no {
      color: var(--accent);
      font-size: clamp(18px, 5.2vw, 28px);
      font-weight: 950;
      line-height: 1;
      letter-spacing: -.02em;
      white-space: nowrap;
    }

    .route-dest {
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .first-eta {
      margin-top: 8px;
      color: var(--green);
      font-size: clamp(20px, 6vw, 30px);
      font-weight: 950;
      line-height: 1;
    }

    .first-eta.now { color: var(--red); }

    .unit {
      margin-left: 2px;
      font-size: 12px;
      font-weight: 850;
      color: inherit;
    }

    .next-times {
      margin-top: 6px;
      display: flex;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.2;
    }

    .next-pill {
      padding: 2px 5px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--muted);
    }

    .hint, .error, .empty {
      width: 100%;
      padding: 18px;
      border-radius: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      backdrop-filter: blur(16px);
    }

    .error {
      color: var(--red);
      border-color: rgba(220, 38, 38, .25);
    }

    .calendar-panel {
      margin-top: 0;
      padding: 14px;
      border-radius: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .calendar-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .calendar-title {
      font-size: 16px;
      font-weight: 950;
      color: var(--text);
    }

    .calendar-subtitle {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
    }

    .gcal-frame-wrap {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: var(--card-solid);
    }

    .gcal-frame-wrap iframe {
      width: 100%;
      height: 560px;
      border: 0;
      display: block;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: flex-end;
      background: rgba(2, 6, 23, .48);
      padding: 14px;
    }

    .modal-backdrop.active { display: flex; }

    .settings-modal {
      width: 100%;
      max-width: 720px;
      max-height: 88vh;
      margin: 0 auto;
      overflow-y: auto;
      border-radius: 28px;
      background: var(--card-solid);
      border: 1px solid var(--line);
      box-shadow: 0 24px 70px rgba(0,0,0,.28);
      padding: 16px;
      animation: slideUp .18s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(18px); opacity: .75; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 22px;
      font-weight: 950;
      letter-spacing: -.02em;
    }

    .close-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
    }

    .station-box {
      padding: 12px;
      border-radius: 20px;
      background: var(--accent-soft);
      border: 1px solid var(--line);
      margin-bottom: 10px;
    }

    .station-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
    }

    .station-label {
      color: var(--accent);
      font-size: 14px;
      font-weight: 950;
    }

    .remove-station-btn {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0 10px;
      background: var(--card);
      color: var(--red);
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .add-station-btn {
      width: 100%;
      min-height: 48px;
      border: 1px dashed var(--accent);
      border-radius: 17px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 16px;
      font-weight: 950;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .form-grid {
      display: grid;
      gap: 10px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    input, select {
      width: 100%;
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 0 13px;
      background: var(--card);
      color: var(--text);
      font-size: 16px;
      font-weight: 750;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .settings-note {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 16px;
      background: var(--accent-soft);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      font-weight: 700;
    }

    .settings-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button.primary,
    button.secondary {
      min-height: 52px;
      border-radius: 17px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    button.primary {
      border: 0;
      color: white;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 14px 30px rgba(37, 99, 235, .23);
    }

    button.secondary {
      border: 1px solid var(--line);
      color: var(--text);
      background: var(--card);
    }

    button:active { transform: scale(.985); }


    .settings-credit {
      margin-top: 12px;
      text-align: center;
      font-size: 9px;
      line-height: 1.2;
    }

    .settings-credit a {
      color: var(--muted);
      text-decoration: none;
      opacity: .55;
    }

    .settings-credit a:active {
      opacity: .85;
    }

    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; }
      .form-grid { grid-template-columns: 1.1fr .9fr; }
      .station-box .form-grid { grid-template-columns: .75fr 1fr 1fr; }
      .route-dot { width: calc(20% - 7px); }
    }

    /* Keep ETA and Calendar side-by-side on Android tablets in portrait or landscape. */
    @media (max-width: 599px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .calendar-panel { margin-top: 14px; }
      .gcal-frame-wrap iframe { height: 360px; }
    }

    @media (min-width: 600px) {
      .dashboard-grid {
        grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr);
      }
      .gcal-frame-wrap iframe { height: 560px; }
    }

    @media (max-width: 390px) {
      body { padding-left: 8px; padding-right: 8px; }
      .topbar {
        grid-template-columns: 42px 1fr 42px 42px;
      }
      .gear-btn, .status-dot, .refresh-btn {
        width: 42px;
        height: 42px;
      }
      .route-dot {
        width: calc(33.333% - 6px);
        min-height: 86px;
        border-radius: 19px;
      }
      .settings-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar">
      <button class="gear-btn" id="openSettingsBtn" type="button" aria-label="開啟設定">⚙</button>
      <div class="clock-box">
        <div class="system-time" id="systemTime">--:--:--</div>
        <div class="system-date" id="systemDate">系統時間</div>
      </div>
      <button class="refresh-btn" id="forceRefreshBtn" type="button" aria-label="強制更新">⟳</button>
      <div class="status-dot" id="statusDot" title="狀態">○</div>
    </section>

    <div class="dashboard-grid">
      <section class="stations-wrap" id="stationsWrap">
        <div class="hint">
          請按左上角 ⚙ 選擇巴士公司並輸入巴士站 ID。<br>
          支援 KMB/LWB 及城巴 CTB，可自行新增多個車站。
        </div>
      </section>

      <section class="calendar-panel">
      <div class="calendar-head">
        <div class="calendar-title">今日行程</div>
        <div class="calendar-subtitle">Google 日曆</div>
      </div>
      <div class="gcal-frame-wrap">
        <iframe
          id="gcalFrame"
          src="https://calendar.google.com/calendar/embed?src=family06923222005615842840%40group.calendar.google.com&ctz=Asia%2FHong_Kong&mode=AGENDA&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0"
          frameborder="0"
          scrolling="no"
          loading="lazy"></iframe>
      </div>
      </section>
    </div>
  </main>

  <section class="modal-backdrop" id="settingsBackdrop" aria-hidden="true">
    <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-head">
        <div class="modal-title" id="settingsTitle">設定</div>
        <button class="close-btn" id="closeSettingsBtn" type="button" aria-label="關閉設定">×</button>
      </div>

      <div id="stationList"></div>
      <button class="add-station-btn" id="addStationBtn" type="button">＋ 新增車站</button>

      <div class="form-grid" style="margin-top:10px;">
        <div>
          <label for="refreshSeconds">更新時間</label>
          <select id="refreshSeconds">
            <option value="15">每 15 秒</option>
            <option value="30" selected>每 30 秒</option>
            <option value="60">每 60 秒</option>
          </select>
        </div>
        <div>
          <label for="themeSelect">畫面模式</label>
          <select id="themeSelect">
            <option value="light">淺色模式</option>
            <option value="dark">深色模式</option>
          </select>
        </div>
      </div>

      <div class="settings-note">系統會自動列出每個車站的所有巴士路線。可加入多個車站；KMB/LWB 使用 KMB API；城巴 CTB 使用 DATA.GOV.HK 指定車站 ETA API。<br>唔知道 Stop ID？可到 <a href="https://hkbushub.netlify.app" target="_blank" rel="noopener noreferrer">hkbushub.netlify.app</a> 查詢巴士站 ID。</div>

          <div class="settings-actions">
        <button class="primary" id="saveSettingsBtn" type="button">儲存並更新</button>
        <button class="secondary" id="cancelSettingsBtn" type="button">取消</button>
      </div>

      <div class="settings-credit">
        <a href="https://www.threads.com/@bbbeeennnhk" target="_blank" rel="noopener noreferrer">由 Threads@bbbeeennnhk 制作</a>
      </div>
    </div>
  </section>

  <script>
    const els = {
      openSettingsBtn: document.getElementById("openSettingsBtn"),
      settingsBackdrop: document.getElementById("settingsBackdrop"),
      closeSettingsBtn: document.getElementById("closeSettingsBtn"),
      cancelSettingsBtn: document.getElementById("cancelSettingsBtn"),
      saveSettingsBtn: document.getElementById("saveSettingsBtn"),
      addStationBtn: document.getElementById("addStationBtn"),
      stationList: document.getElementById("stationList"),
      refreshSeconds: document.getElementById("refreshSeconds"),
      themeSelect: document.getElementById("themeSelect"),
      systemTime: document.getElementById("systemTime"),
      systemDate: document.getElementById("systemDate"),
      statusDot: document.getElementById("statusDot"),
      forceRefreshBtn: document.getElementById("forceRefreshBtn"),
      gcalFrame: document.getElementById("gcalFrame"),
      stationsWrap: document.getElementById("stationsWrap")
    };

    let timer = null;
    let nextRefreshAt = 0;
    let lastUpdatedText = "";
    let stopData = {};
    let stationSettings = [{ company: "KMB", id: "", name: "" }];

    function safeText(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function normalizeStopId(value) {
      return String(value || "").trim().replace(/\s+/g, "").toUpperCase();
    }

    function normalizeCompany(value) {
      return String(value || "KMB").toUpperCase() === "CTB" ? "CTB" : "KMB";
    }

    function stationKey(stop) {
      return `${stop.company}:${stop.id}`;
    }

    function companyLabel(company) {
      return company === "CTB" ? "城巴 CTB" : "KMB/LWB";
    }

    function createEmptyStation() {
      return { company: "KMB", id: "", name: "", hiddenRoutes: "" };
    }

    function updateStationSettingsFromForm() {
      const rows = Array.from(els.stationList.querySelectorAll(".station-box"));
      stationSettings = rows.map(row => {
        const index = Number(row.dataset.index);
        return {
          company: normalizeCompany(row.querySelector(".company-input")?.value || "KMB"),
          id: normalizeStopId(row.querySelector(".stop-id-input")?.value || ""),
          name: String(row.querySelector(".stop-name-input")?.value || "").trim(),
          hiddenRoutes: String(row.querySelector(".hide-routes-input")?.value || "").trim()
        };
      }).filter((station, index, list) => station.id || station.name || station.hiddenRoutes || list.length === 1);

      if (!stationSettings.length) stationSettings = [createEmptyStation()];
    }

    function renderStationSettings() {
      if (!stationSettings.length) stationSettings = [createEmptyStation()];

      els.stationList.innerHTML = stationSettings.map((station, index) => `
        <div class="station-box" data-index="${index}">
          <div class="station-head">
            <div class="station-label">車站 ${index + 1}</div>
            ${stationSettings.length > 1 ? `<button class="remove-station-btn" type="button" data-remove-index="${index}">刪除</button>` : ""}
          </div>
          <div class="form-grid">
            <div>
              <label for="company-${index}">巴士公司</label>
              <select id="company-${index}" class="company-input">
                <option value="KMB" ${normalizeCompany(station.company) === "KMB" ? "selected" : ""}>KMB / LWB</option>
                <option value="CTB" ${normalizeCompany(station.company) === "CTB" ? "selected" : ""}>城巴 CTB</option>
              </select>
            </div>
            <div>
              <label for="stop-${index}">巴士站 ID</label>
              <input id="stop-${index}" class="stop-id-input" type="text" inputmode="latin" autocomplete="off" value="${safeText(station.id)}" placeholder="KMB：C78F66DF6FA871B6｜城巴：001001" />
            </div>
            <div>
              <label for="name-${index}">顯示名稱</label>
              <input id="name-${index}" class="stop-name-input" type="text" autocomplete="off" value="${safeText(station.name)}" placeholder="例如：青衣邨宜業樓 / 中環碼頭" />
            </div>
            <div>
              <label for="hide-routes-${index}">隱藏路線</label>
              <input id="hide-routes-${index}" class="hide-routes-input" type="text" autocomplete="off" value="${safeText(station.hiddenRoutes || "")}" placeholder="例如：970,970X,A21" />
            </div>
          </div>
        </div>
      `).join("");

      els.stationList.querySelectorAll("input, select").forEach(input => {
        input.addEventListener("input", updateStationSettingsFromForm);
        input.addEventListener("change", updateStationSettingsFromForm);
      });

      els.stationList.querySelectorAll(".remove-station-btn").forEach(button => {
        button.addEventListener("click", () => {
          updateStationSettingsFromForm();
          const index = Number(button.dataset.removeIndex);
          stationSettings.splice(index, 1);
          if (!stationSettings.length) stationSettings = [createEmptyStation()];
          renderStationSettings();
        });
      });
    }

    function getStops() {
      updateStationSettingsFromForm();
      return stationSettings
        .map((station, index) => ({
          number: index + 1,
          company: normalizeCompany(station.company),
          id: normalizeStopId(station.id),
          name: station.name.trim() || `車站 ${index + 1}`,
          hiddenRoutes: String(station.hiddenRoutes || "").trim()
        }))
        .filter(station => station.id);
    }

    function buildApiUrl(stop) {
      if (stop.company === "CTB") {
        return `https://rt.data.gov.hk/v1/transport/batch/stop-eta/CTB/${encodeURIComponent(stop.id)}?lang=zh-hant`;
      }
      return `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${encodeURIComponent(stop.id)}`;
    }

    function parseEta(value) {
      if (!value) return null;
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function getMinutes(date) {
      return Math.max(0, Math.ceil((date.getTime() - Date.now()) / 60000));
    }

    function formatClock(date) {
      return new Intl.DateTimeFormat("zh-Hant-HK", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(date);
    }

    function routeSort(a, b) {
      return String(a.route).localeCompare(String(b.route), "en", { numeric: true });
    }

    function updateSystemTime() {
      const now = new Date();
      els.systemTime.textContent = new Intl.DateTimeFormat("zh-Hant-HK", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(now);

      els.systemDate.textContent = new Intl.DateTimeFormat("zh-Hant-HK", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        weekday: "short"
      }).format(now);
    }

    function getDestination(item) {
      return String(item.dest_tc || item.dest || item.dest_en || item.dest_sc || "").trim();
    }

    function groupByRoute(items) {
      const groups = new Map();

      for (const item of items) {
        const route = String(item.route || "").toUpperCase();
        if (!route) continue;

        const etaDate = parseEta(item.eta);
        if (!etaDate) continue;

        const dest = getDestination(item);
        const dir = String(item.dir || "").toUpperCase();
        const key = `${route}|${dest || dir}`;

        if (!groups.has(key)) {
          groups.set(key, {
            route,
            dest,
            dir,
            rows: []
          });
        }

        groups.get(key).rows.push({
          eta: etaDate,
          seq: Number(item.eta_seq || item.seq || 0)
        });
      }

      return Array.from(groups.values())
        .map(group => {
          group.rows.sort((a, b) => a.eta - b.eta || a.seq - b.seq);

          const unique = [];
          const used = new Set();

          for (const row of group.rows) {
            const key = row.eta.getTime();
            if (used.has(key)) continue;
            used.add(key);
            unique.push(row);
            if (unique.length >= 3) break;
          }

          return { ...group, rows: unique };
        })
        .sort((a, b) => {
          const routeCompare = String(a.route).localeCompare(String(b.route), "en", { numeric: true });
          if (routeCompare !== 0) return routeCompare;
          return String(a.dest || a.dir).localeCompare(String(b.dest || b.dir), "zh-Hant-HK");
        });
    }

    function renderAllStops() {
      const stops = getStops();

      if (!stops.length) {
        els.stationsWrap.innerHTML = `
          <div class="hint">
            請按左上角 ⚙ 選擇巴士公司並輸入巴士站 ID。<br>
            支援 KMB/LWB 及城巴 CTB，可自行新增多個車站。
          </div>`;
        updateStatusDot("idle");
        return;
      }

      els.stationsWrap.innerHTML = stops.map(stop => {
        const hiddenSet = new Set(
          String(stop.hiddenRoutes || "")
            .split(",")
            .map(x => x.trim().toUpperCase())
            .filter(Boolean)
        );
        const groups = groupByRoute(stopData[stationKey(stop)] || [])
          .filter(group => {
            const routeUp = String(group.route || "").toUpperCase();
            const destUp = String(group.dest || "").toUpperCase();
            return !hiddenSet.has(routeUp) && !hiddenSet.has(destUp);
          });
        return `
          <section class="station-section active">
            <div class="stop-title">
              <div class="stop-name">${safeText(stop.name)}</div>
              <div class="stop-meta">${safeText(companyLabel(stop.company))}｜更新：${safeText(lastUpdatedText || "--")}｜Stop ID：${safeText(stop.id)}</div>
            </div>
            <section class="list">
              ${renderRoutes(groups)}
            </section>
          </section>`;
      }).join("");

      document.title = `${stops[0].name}｜巴士 ETA`;
    }

    function renderRoutes(groups) {
      if (!groups.length) {
        return `
          <div class="empty">
            暫時未有到站資料。<br>
            請檢查巴士站 ID 是否正確。
          </div>`;
      }

      return groups.map(group => {
        const first = group.rows[0];
        const mins = first ? getMinutes(first.eta) : null;
        const isNow = mins !== null && mins <= 1;

        const nextTimes = group.rows.slice(1).map(row => {
          const nextMins = getMinutes(row.eta);
          return `<span class="next-pill">${nextMins <= 1 ? "即到" : `${nextMins}分`}</span>`;
        }).join("");

        return `
          <article class="route-dot">
            <div class="route-no">${safeText(group.route)}</div>
            ${group.dest ? `<div class="route-dest" title="${safeText(group.dest)}">${safeText(group.dest)}</div>` : ""}
            <div class="first-eta ${isNow ? "now" : ""}">
              ${mins === null ? "--" : isNow ? "即到" : `${mins}<span class="unit">分</span>`}
            </div>
            <div class="next-times">
              ${nextTimes || `<span class="next-pill">${first ? formatClock(first.eta) : "未有"}</span>`}
            </div>
          </article>`;
      }).join("");
    }

    function updateStatusDot(status) {
      if (status === "loading") {
        els.statusDot.textContent = "↻";
        els.statusDot.title = "讀取中";
      } else if (status === "ok") {
        const secondsLeft = nextRefreshAt ? Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000)) : "";
        els.statusDot.textContent = secondsLeft || "✓";
        els.statusDot.title = secondsLeft ? `${secondsLeft} 秒後更新` : "已更新";
      } else if (status === "error") {
        els.statusDot.textContent = "!";
        els.statusDot.title = "讀取失敗";
      } else {
        els.statusDot.textContent = "○";
        els.statusDot.title = "尚未設定";
      }
    }

    function refreshGoogleCalendar() {
      const frame = els.gcalFrame;
      if (!frame || !frame.src || frame.src.includes("YOUR_CALENDAR_ID_HERE")) return;
      const url = new URL(frame.src);
      url.searchParams.set("_refresh", Date.now().toString());
      frame.src = url.toString();
    }

    async function fetchEta() {
      refreshGoogleCalendar();
      const stops = getStops();

      if (!stops.length) {
        updateStatusDot("idle");
        els.stationsWrap.innerHTML = `<div class="error">請按左上角 ⚙ 輸入最少一個巴士站 ID。</div>`;
        return;
      }

      updateStatusDot("loading");

      try {
        const results = await Promise.all(stops.map(async stop => {
          const response = await fetch(buildApiUrl(stop), { cache: "no-store" });
          if (!response.ok) throw new Error(`${stop.name} ${companyLabel(stop.company)} HTTP ${response.status}`);
          const json = await response.json();
          return { key: stationKey(stop), data: json.data || [] };
        }));

        stopData = {};
        for (const result of results) {
          stopData[result.key] = result.data;
        }

        lastUpdatedText = new Intl.DateTimeFormat("zh-Hant-HK", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }).format(new Date());

        renderAllStops();

        nextRefreshAt = Date.now() + Number(els.refreshSeconds.value) * 1000;
        updateStatusDot("ok");
        saveSettings();

        clearTimeout(timer);
        timer = setTimeout(fetchEta, Number(els.refreshSeconds.value) * 1000);
      } catch (error) {
        els.stationsWrap.innerHTML = `
          <div class="error">
            無法讀取公開 API。<br>
            請檢查巴士公司、Stop ID 或網絡連線。<br>
            錯誤：${safeText(error.message)}
          </div>`;
        nextRefreshAt = Date.now() + Number(els.refreshSeconds.value) * 1000;
        updateStatusDot("error");
      }
    }

    function saveSettings() {
      updateStationSettingsFromForm();
      const data = {
        stations: stationSettings
          .map(station => ({
            company: normalizeCompany(station.company),
            id: normalizeStopId(station.id),
            name: String(station.name || "").trim(),
            hiddenRoutes: String(station.hiddenRoutes || "").trim()
          }))
          .filter((station, index, list) => station.id || station.name || station.hiddenRoutes || list.length === 1),
        refreshSeconds: els.refreshSeconds.value,
        theme: els.themeSelect.value
      };
      localStorage.setItem("hkBusEtaSettings", JSON.stringify(data));
    }

    function getUrlStations(params) {
      const stations = [];
      const firstStop = params.get("stop") || params.get("stop1") || "";
      if (firstStop) {
        stations.push({
          company: normalizeCompany(params.get("co") || params.get("co1") || "KMB"),
          id: normalizeStopId(firstStop),
          name: params.get("name") || params.get("name1") || "",
          hiddenRoutes: params.get("hide") || params.get("hide1") || ""
        });
      }

      for (let i = 2; i <= 20; i += 1) {
        const stopId = params.get(`stop${i}`) || "";
        if (!stopId) continue;
        stations.push({
          company: normalizeCompany(params.get(`co${i}`) || "KMB"),
          id: normalizeStopId(stopId),
          name: params.get(`name${i}`) || "",
          hiddenRoutes: params.get(`hide${i}`) || ""
        });
      }

      const repeatedStops = params.getAll("stop");
      if (repeatedStops.length > 1) {
        return repeatedStops.map((stopId, index) => ({
          company: normalizeCompany(params.getAll("co")[index] || params.get("co") || "KMB"),
          id: normalizeStopId(stopId),
          name: params.getAll("name")[index] || `車站 ${index + 1}`,
          hiddenRoutes: params.getAll("hide")[index] || ""
        })).filter(station => station.id);
      }

      return stations.filter(station => station.id);
    }

    function loadSettings() {
      const params = new URLSearchParams(location.search);
      const urlStations = getUrlStations(params);

      let saved = {};
      try {
        saved = JSON.parse(localStorage.getItem("hkBusEtaSettings") || "{}");
      } catch {}

      if (urlStations.length) {
        stationSettings = urlStations;
      } else if (Array.isArray(saved.stations) && saved.stations.length) {
        stationSettings = saved.stations.map(station => ({
          company: normalizeCompany(station.company),
          id: normalizeStopId(station.id),
          name: String(station.name || "").trim(),
          hiddenRoutes: String(station.hiddenRoutes || "").trim()
        }));
      } else if (saved.stopId1 || saved.stopId2) {
        stationSettings = [
          { company: normalizeCompany(saved.company1), id: normalizeStopId(saved.stopId1), name: saved.stopName1 || "" },
          { company: normalizeCompany(saved.company2), id: normalizeStopId(saved.stopId2), name: saved.stopName2 || "" }
        ].filter(station => station.id || station.name);
      } else {
        stationSettings = [createEmptyStation()];
      }

      if (!stationSettings.length) stationSettings = [createEmptyStation()];
      renderStationSettings();

      const refresh = params.get("refresh") || saved.refreshSeconds || "30";
      if (["15", "30", "60"].includes(refresh)) els.refreshSeconds.value = refresh;

      const theme = saved.theme || "light";
      els.themeSelect.value = theme;
      document.documentElement.setAttribute("data-theme", theme);

      if (urlStations.length || stationSettings.some(station => station.id)) fetchEta();
      else updateStatusDot("idle");
    }

    function openSettings() {
      els.settingsBackdrop.classList.add("active");
      els.settingsBackdrop.setAttribute("aria-hidden", "false");
      setTimeout(() => els.stationList.querySelector(".stop-id-input")?.focus(), 80);
    }

    function closeSettings() {
      els.settingsBackdrop.classList.remove("active");
      els.settingsBackdrop.setAttribute("aria-hidden", "true");
    }

    els.openSettingsBtn.addEventListener("click", openSettings);
    els.closeSettingsBtn.addEventListener("click", closeSettings);
    els.cancelSettingsBtn.addEventListener("click", closeSettings);

    els.forceRefreshBtn.addEventListener("click", () => {
      if (els.forceRefreshBtn.classList.contains("spinning")) return;
      els.forceRefreshBtn.classList.add("spinning");
      clearTimeout(timer);
      fetchEta();
      setTimeout(() => els.forceRefreshBtn.classList.remove("spinning"), 500);
    });

    els.addStationBtn.addEventListener("click", () => {
      updateStationSettingsFromForm();
      stationSettings.push(createEmptyStation());
      renderStationSettings();
      setTimeout(() => {
        const inputs = els.stationList.querySelectorAll(".stop-id-input");
        inputs[inputs.length - 1]?.focus();
      }, 50);
    });

    els.settingsBackdrop.addEventListener("click", event => {
      if (event.target === els.settingsBackdrop) closeSettings();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeSettings();
    });

    els.themeSelect.addEventListener("change", () => {
      document.documentElement.setAttribute("data-theme", els.themeSelect.value);
    });

    els.saveSettingsBtn.addEventListener("click", () => {
      document.documentElement.setAttribute("data-theme", els.themeSelect.value);
      saveSettings();
      closeSettings();
      fetchEta();
    });

    setInterval(() => {
      updateSystemTime();
      if (nextRefreshAt) updateStatusDot("ok");
      if (Object.keys(stopData).length) renderAllStops();
    }, 1000);

    updateSystemTime();
    loadSettings();
  </script>
</body>
</html>
